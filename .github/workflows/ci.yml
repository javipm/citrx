name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        shell: bash
        run: |
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Quality
        shell: bash
        run: |
          source scripts/ci-setup-node.sh 24.15.0
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm lint
          pnpm format:check

  test:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22.13.0"
          - os: ubuntu-latest
            node: "24.15.0"
          - os: macos-latest
            node: "24.15.0"
          - os: windows-latest
            node: "24.15.0"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        shell: bash
        run: |
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Test
        shell: bash
        run: |
          source scripts/ci-setup-node.sh "${{ matrix.node }}"
          pnpm install --frozen-lockfile
          pnpm test

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        shell: bash
        run: |
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Package smoke
        shell: bash
        run: |
          source scripts/ci-setup-node.sh 24.15.0
          pnpm install --frozen-lockfile
          bash scripts/package-smoke.sh
